[tool.ruff]
target-version = "py312"
line-length = 90
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
exclude = [".venv", "data"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.ruff.format]
line-ending = "lf"
